name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: api_mirror
          POSTGRES_PASSWORD: api_mirror
          POSTGRES_DB: api_mirror_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U api_mirror"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://api_mirror:api_mirror@localhost:5432/api_mirror_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
